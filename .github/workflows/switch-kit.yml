# Builds the Switch runtime kit: everything in msr.nro that is NOT the game's code.
#
# No game files are used or needed. The kit holds the port's own compiled code (renderer, sound,
# input, menus), the shader compiler (libuam.a) and the function finder from msr2ds. The game's
# code is translated and linked on your own PC by tools/switch/local_build.sh.
#
# Runs on every push that changes the port's code, or by hand from the Actions tab.

name: Switch runtime kit

on:
  workflow_dispatch:
  push:
    paths:
      - "runtime/**"
      - "tools/switch/**"
      - ".github/workflows/switch-kit.yml"

permissions:
  contents: read

env:
  W: ${{ github.workspace }}/build
  MSR2DS_COMMIT: 4b4296a

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install meson mako
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build bison flex
          mkdir -p "$W/nxout" "$W/nxrt"

      - name: Restore the shader compiler
        id: uamcache
        uses: actions/cache@v4
        with:
          path: build/libuam.a
          key: libuam-${{ hashFiles('tools/switch/uam/**') }}

      - name: Build the shader compiler
        if: steps.uamcache.outputs.cache-hit != 'true'
        run: bash tools/switch/uam/build.sh "$W"

      - name: Build the port's shaders and code
        run: |
          cp tools/switch/nxbuild.sh "$W/"
          docker run --rm -v "$W":/w -v "$PWD/runtime":/r -v "$PWD/tools":/t devkitpro/devkita64 bash -c '
            command -v python3 > /dev/null || (apt-get update -q && apt-get install -y -q python3)
            python3 /t/switch/mkshaders.py /r /w
            bash /w/nxbuild.sh'

      - name: Pack the kit
        run: |
          git clone -q https://github.com/gminustwo/msr2ds msr2ds
          git -C msr2ds checkout -q "$MSR2DS_COMMIT"
          mkdir -p kit/nxrt
          cp "$W"/nxrt/*.o kit/nxrt/
          cp "$W/libuam.a" kit/
          cp msr2ds/tools/msr/recomp/analyze.py kit/
          cp msr2ds/LICENSE* kit/ 2>/dev/null || true
          {
            echo "MSR-nx runtime kit"
            echo "repo commit: $GITHUB_SHA"
            echo "msr2ds commit (analyze.py): $MSR2DS_COMMIT"
            echo "built: $(date -u)"
          } > kit/KIT_INFO.txt
          ls -la kit kit/nxrt

      - name: Upload the kit
        uses: actions/upload-artifact@v4
        with:
          name: msr-kit
          path: kit
          retention-days: 30
